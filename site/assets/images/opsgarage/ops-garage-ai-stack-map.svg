<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12243d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#5eead4"/></marker>
    <style>
      .title{font:800 52px 'Segoe UI',Arial,sans-serif;fill:#eef5ff;letter-spacing:-2px}.subtitle{font:400 22px 'Segoe UI',Arial,sans-serif;fill:#b6c4d7}.section{font:800 18px 'Segoe UI',Arial,sans-serif;fill:#5eead4;letter-spacing:3px}.label{font:800 22px 'Segoe UI',Arial,sans-serif;fill:#eef5ff}.body{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#b6c4d7}.small{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#b6c4d7}.human{fill:#1d2940;stroke:#f8c66d}.auto{fill:#132d3d;stroke:#5eead4}.node{stroke-width:2}.line{stroke:#5eead4;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/>
  <rect x="70" y="58" width="58" height="58" rx="15" fill="url(#accent)"/>
  <path d="M84 100V75h11c7 0 12 5 12 12s-5 13-12 13H84Zm8-7h3c3 0 5-2 5-6s-2-6-5-6h-3v12Z" fill="#07111f"/>
  <text x="150" y="91" class="label">OPS GARAGE AI</text><text x="150" y="118" class="small">From first touch to closed implementation</text>
  <text x="70" y="205" class="title">How the system turns interest into revenue</text>
  <text x="70" y="245" class="subtitle">Automation moves the work forward. Frank stays in control of every customer-facing decision.</text>

  <text x="70" y="315" class="section">1  ATTRACT</text>
  <rect x="70" y="345" width="260" height="170" rx="20" class="node auto" filter="url(#shadow)"/><text x="98" y="390" class="label">Website</text><text x="98" y="428" class="body">Phone CTA and</text><text x="98" y="454" class="body">callback intake page</text><text x="98" y="490" class="small">opsgarageai.com</text>
  <rect x="70" y="545" width="260" height="170" rx="20" class="node auto" filter="url(#shadow)"/><text x="98" y="590" class="label">Hermes</text><text x="98" y="628" class="body">Finds local prospects,</text><text x="98" y="654" class="body">enriches, drafts outreach</text><text x="98" y="690" class="small">Google Places + Sheets</text>

  <path d="M330 430H400" class="line"/><path d="M330 630H400" class="line"/>
  <text x="420" y="315" class="section">2  QUALIFY</text>
  <rect x="420" y="345" width="280" height="170" rx="20" class="node auto" filter="url(#shadow)"/><text x="450" y="390" class="label">Retell AI</text><text x="450" y="428" class="body">Answers inbound calls</text><text x="450" y="454" class="body">and calls form leads</text><text x="450" y="490" class="small">Conversation is transcribed</text>
  <rect x="420" y="545" width="280" height="170" rx="20" class="node human" filter="url(#shadow)"/><text x="450" y="590" class="label">Frank reviews</text><text x="450" y="628" class="body">Approves outreach</text><text x="450" y="654" class="body">before anything sends</text><text x="450" y="690" class="small">Draft only until approved</text>
  <path d="M700 430H770" class="line"/><path d="M700 630H770" class="line"/>

  <text x="790" y="315" class="section">3  UNDERSTAND</text>
  <rect x="790" y="345" width="300" height="170" rx="20" class="node auto" filter="url(#shadow)"/><text x="820" y="390" class="label">n8n on Unraid</text><text x="820" y="428" class="body">Routes calls, transcripts,</text><text x="820" y="454" class="body">analysis, ROI, and drafts</text><text x="820" y="490" class="small">Cloudflare Tunnel + relay</text>
  <rect x="790" y="545" width="300" height="170" rx="20" class="node auto" filter="url(#shadow)"/><text x="820" y="590" class="label">OpenAI analysis</text><text x="820" y="628" class="body">Finds pain points, quick</text><text x="820" y="654" class="body">wins, tools, and automations</text><text x="820" y="690" class="small">Market-specific question logic</text>
  <path d="M1090 430H1160" class="line"/><path d="M1090 630H1160" class="line"/>

  <text x="1180" y="315" class="section">4  PROVE VALUE</text>
  <rect x="1180" y="345" width="280" height="170" rx="20" class="node auto" filter="url(#shadow)"/><text x="1210" y="390" class="label">ROI summary</text><text x="1210" y="428" class="body">Hours saved, labor value,</text><text x="1210" y="454" class="body">and conservative benefit</text><text x="1210" y="490" class="small">Stored in Google Sheets</text>
  <rect x="1180" y="545" width="280" height="170" rx="20" class="node human" filter="url(#shadow)"/><text x="1210" y="590" class="label">Frank approves</text><text x="1210" y="628" class="body">Findings, assumptions,</text><text x="1210" y="654" class="body">deck, and follow-up</text><text x="1210" y="690" class="small">No report sends automatically</text>
  <path d="M1460 430H1530" class="line"/><path d="M1460 630H1530" class="line"/>

  <text x="1550" y="315" class="section">5  CLOSE</text>
  <rect x="1550" y="345" width="180" height="170" rx="20" class="node human" filter="url(#shadow)"/><text x="1578" y="390" class="label">Outlook</text><text x="1578" y="428" class="body">Frank sends the</text><text x="1578" y="454" class="body">approved follow-up</text><text x="1578" y="490" class="small">Calendly link included</text>
  <rect x="1550" y="545" width="180" height="170" rx="20" class="node human" filter="url(#shadow)"/><text x="1578" y="590" class="label">Deal</text><text x="1578" y="628" class="body">Prospect books.</text><text x="1578" y="654" class="body">Frank scopes and</text><text x="1578" y="680" class="body">closes implementation.</text>

  <rect x="70" y="820" width="1660" height="190" rx="24" fill="#0a1424" stroke="#263b56" stroke-width="2"/>
  <text x="105" y="865" class="section">THE CONTROL LINE</text>
  <text x="105" y="913" class="label">Automated</text><rect x="240" y="895" width="230" height="34" rx="17" fill="#132d3d" stroke="#5eead4"/><text x="260" y="918" class="small">routing • transcription • analysis</text>
  <text x="650" y="913" class="label">Human approval</text><rect x="855" y="895" width="240" height="34" rx="17" fill="#1d2940" stroke="#f8c66d"/><text x="875" y="918" class="small">outreach • findings • sending</text>
  <text x="105" y="965" class="body">The system does the repetitive work. Frank controls the relationship, the claims, the timing, and the close.</text>
  <text x="105" y="993" class="small">Ops Garage AI  •  Practical automation for real-world teams</text>
</svg>
