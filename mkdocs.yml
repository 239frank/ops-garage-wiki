site_name: OpsGarageAI
site_description: An operating notebook for approval-gated AI systems, automation, compliance workflows, and local venture builds.
site_url: https://opsgarageai.com

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: blue

extra_css:
  - styles/ops-garage.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - OpsGarageAI:
      - Overview: opsgarage/index.md
      - Operating Principles: opsgarage/principles.md
      - Workflow Library:
          - Lead Engine: opsgarage/workflows/lead-engine.md
          - Approval Gate: opsgarage/workflows/approval-gate.md
          - Margo Content Loop: opsgarage/workflows/margo-content-loop.md
      - Build Stories:
          - The Lead Engine: opsgarage/stories/lead-engine.md
          - Compliance Copilots: opsgarage/stories/compliance-copilots.md
          - Venture Lab: opsgarage/stories/venture-lab.md
      - Visual Stack Map: opsgarage/stack-map.md
      - Build Gallery: opsgarage/gallery.md
  - Archive:
      - Original Portfolio Home: index.md
      - About Me: start/about.md
      - Current Focus: start/current-focus.md
  - Portfolio:
      - Portfolio Home: projects/index.md
      - Incident Response Tracker: projects/ir-tracker.md
      - GRC LLM: projects/grc-llm.md
      - Security Onion Lab: projects/security-onion-lab.md
      - n8n + Discord Automation: projects/n8n-discord-automation.md
      - Public Exposure Watch: projects/public-exposure-watch.md
      - Home Lab Operations: projects/home-lab-ops.md
      - Domain Research Tools: projects/domain-tools.md
      - Forza Tuning Calculator: projects/forza-tuning-calculator.md
      - Audio Separation Lab: projects/audio-separation-lab.md
      - Personal Wiki Build: projects/personal-wiki.md
  - Cyber / GRC:
      - Overview: cyber/index.md
      - NIST 800-53 Notes: cyber/nist-800-53.md
      - RMF / ATO Notes: cyber/rmf-ato.md
      - CMMC Notes: cyber/cmmc.md
  - Home Lab:
      - Overview: homelab/index.md
      - Unraid Server: homelab/unraid.md
      - Network Diagram: homelab/network.md
      - Docker Stack: homelab/docker.md
      - Monitoring: homelab/monitoring.md
      - Camera / Physical Security Lab: homelab/cameras-security.md
  - Automation:
      - Overview: automation/index.md
      - n8n Workflows: automation/n8n.md
      - Discord Bots: automation/discord-bots.md
      - Alerting: automation/alerting.md
  - Field Notes:
